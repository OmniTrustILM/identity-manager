[package]
name = "im-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4"
plist = "1.10.3"
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
ts-rs = { version = "=12.0.1", optional = true }
url = "2.5.8"
base64 = "0.23.1"
getrandom = "0.4.3"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["net", "time", "sync", "macros", "io-util", "rt"] }
keyring-core = "1.0.1"

[features]
ts = ["dep:ts-rs"]

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6.5"
ts-rs = "=12.0.1"
