[package]
name = "im-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4"
plist = "1.10.3"
serde_json = "1"
regex = "1.13.1"
jiff = { version = "=0.2.39", default-features = false, features = ["std", "tz-system"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
ts-rs = { version = "=12.0.1", optional = true }
url = "2.5.8"
base64 = "0.23.1"
getrandom = "0.4.3"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["net", "time", "sync", "macros", "io-util", "rt"] }
keyring-core = "1.0.1"
rustls = "0.23.46"
rustls-platform-verifier = "0.7.1"
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = { version = "1.19.0", optional = true }

[features]
ts = ["dep:ts-rs"]
testing = ["dep:aws-lc-rs"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7.0", features = ["macos-12"] }
nix = { version = "0.31", default-features = false, features = ["user"] }
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
jiff = { version = "=0.2.39", default-features = false, features = ["tzdb-bundle-platform"] }
rustls-cng = "0.7.1"
winreg = "0.56"
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6.5"
aws-lc-rs = "1.19.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "aws_lc_rs", "pem", "x509-parser"] }
tokio-rustls = "0.26.6"
ts-rs = "=12.0.1"
