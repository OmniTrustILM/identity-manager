[package]
name = "identity-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "identity_manager"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
auto-launch = "0.6.0"
im-core = { path = "../core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2.10.2"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["sync", "time"] }
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGSession", "CGEventSource", "CGEventTypes"] }
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-future = "0.3.2"
windows = { version = "0.62.2", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
im-core = { path = "../core", features = ["ts"] }
serde_json = "1"
ts-rs = "=12.0.1"
tempfile = "3.27"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }
tauri = { version = "2.12.5", features = ["test"] }
