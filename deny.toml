[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; reached only through gtk and glib, the Linux windowing stack of Tauri" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is reached only through zbus, used by tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is reached only through zbus, used by tauri-plugin-single-instance" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is reached only through zbus, used by tauri-plugin-single-instance" },
]

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "Zlib"]

# MPL-2.0 crates, pulled in by the Tauri web view stack
[[licenses.exceptions]]
crate = "cssparser@0.37.0"
allow = ["MPL-2.0"]

