name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the versions
        if: github.ref_type == 'tag'
        run: bash scripts/verify.sh release-check "$GITHUB_REF_NAME"

      - name: Read the version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      PUBLISH: ${{ needs.gate.outputs.publish }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_MSI_SIGNING: ${{ secrets.TRUSTED_SIGNING_TENANT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/setup

      - name: Bundle
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$HAS_UPDATER_KEY" == true ]]; then
            bash scripts/verify.sh bundle --config '{"bundle":{"createUpdaterArtifacts":true}}'
          elif [[ "$PUBLISH" == true ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; a release needs the updater signature"
            exit 1
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; bundling without updater artifacts"
            bash scripts/verify.sh bundle
          fi

      - name: Self-check the bundled build
        shell: bash
        run: bash scripts/verify.sh self-check

      - name: Sign the MSI
        if: runner.os == 'Windows' && env.HAS_MSI_SIGNING == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.TRUSTED_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.TRUSTED_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.TRUSTED_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\target\release\bundle\msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Warn on unsigned MSI
        if: runner.os == 'Windows' && env.HAS_MSI_SIGNING != 'true'
        shell: bash
        run: echo "::warning::The Trusted Signing secrets are not set; the MSI is not code-signed"

      - name: Sign the updater file again
        if: runner.os == 'Windows' && env.HAS_MSI_SIGNING == 'true' && env.HAS_UPDATER_KEY == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: app/node_modules/.bin/tauri signer sign --app-version "$VERSION" target/release/bundle/msi/*.msi

      - name: Name the release files
        shell: bash
        run: |
          mkdir release-assets
          if [[ "$RUNNER_OS" == Windows ]]; then
            bundle=target/release/bundle/msi
            cp "$bundle"/*.msi "release-assets/Identity-Manager_${VERSION}_x64_en-US.msi"
            if [[ "$HAS_UPDATER_KEY" == true ]]; then
              cp "$bundle"/*.msi.sig "release-assets/Identity-Manager_${VERSION}_x64_en-US.msi.sig"
            fi
          else
            bundle=target/release/bundle
            cp "$bundle"/dmg/*.dmg "release-assets/Identity-Manager_${VERSION}_aarch64.dmg"
            if [[ "$HAS_UPDATER_KEY" == true ]]; then
              cp "$bundle/macos/Identity Manager.app.tar.gz" "release-assets/Identity-Manager_${VERSION}_aarch64.app.tar.gz"
              cp "$bundle/macos/Identity Manager.app.tar.gz.sig" "release-assets/Identity-Manager_${VERSION}_aarch64.app.tar.gz.sig"
            fi
          fi

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: release-assets/*
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      PUBLISH: ${{ needs.gate.outputs.publish }}
      MSI_SIGNED: ${{ secrets.TRUSTED_SIGNING_TENANT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.2'

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Write the SBOM
        run: |
          mkdir release-assets
          syft scan dir:. -o "cyclonedx-json=release-assets/Identity-Manager_${VERSION}_sbom.cdx.json"

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Write the update manifest
        working-directory: release-assets
        run: |
          mac=Identity-Manager_${VERSION}_aarch64.app.tar.gz
          win=Identity-Manager_${VERSION}_x64_en-US.msi
          if [[ ! -f "$mac.sig" || ! -f "$win.sig" ]]; then
            echo "::warning::The updater files are missing; latest.json is not written"
            exit 0
          fi
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "https://github.com/OmniTrustILM/identity-manager/releases/download/v$VERSION" \
            --arg mac "$mac" --arg win "$win" --rawfile mac_sig "$mac.sig" --rawfile win_sig "$win.sig" \
            '{
              version: $version,
              notes: "See the release notes.",
              pub_date: $date,
              platforms: {
                "darwin-aarch64": {signature: ($mac_sig | rtrimstr("\n")), url: "\($base)/\($mac)"},
                "windows-x86_64": {signature: ($win_sig | rtrimstr("\n")), url: "\($base)/\($win)"}
              }
            }' > latest.json

      - name: Write the checksums
        working-directory: release-assets
        run: |
          shopt -s extglob
          files=(!(checksums.txt))
          sha256sum "${files[@]}" > checksums.txt

      - name: Sign the checksums
        env:
          HAS_COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [[ "$HAS_COSIGN_KEY" == true ]]; then
            cosign sign-blob --key=env://COSIGN_PRIVATE_KEY --use-signing-config=false --new-bundle-format=false \
              --output-signature=release-assets/checksums.txt.sig release-assets/checksums.txt --yes
          elif [[ "$PUBLISH" == true ]]; then
            echo "::error::COSIGN_PRIVATE_KEY is not set; a release needs the signed checksums"
            exit 1
          else
            echo "::warning::COSIGN_PRIVATE_KEY is not set; the checksums are not signed"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-assets/*.msi
            release-assets/*.dmg

      - name: Create the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          if [[ "$MSI_SIGNED" != true ]]; then
            notes=(--notes "The Windows installer is not code-signed yet.")
          fi
          gh release create "v$VERSION" --verify-tag --generate-notes "${notes[@]}" release-assets/*

      - name: Upload the release files of the dry run
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: release-assets/*
          retention-days: 3
          if-no-files-found: error
