name: Build
on:
  push:
    branches: [main*]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up toolchains
        uses: ./.github/actions/setup

      - name: Verify
        shell: bash
        run: bash scripts/verify.sh all

      - name: Policy readers
        shell: bash
        run: bash scripts/verify.sh policy-system

      - name: Protected storage
        shell: bash
        run: bash scripts/verify.sh keyring-system

      - name: Client certificate
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/verify.sh identity-system

      - name: Bundle
        shell: bash
        run: bash scripts/verify.sh bundle

      - name: Self-check the bundled build
        shell: bash
        run: bash scripts/verify.sh self-check

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
          retention-days: 3
          if-no-files-found: error

      - name: SonarQube Scan
        if: matrix.os == 'ubuntu-latest' && github.ref_type == 'branch'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dproject.settings=/dev/null
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=OmniTrustILM_identity-manager
            -Dsonar.organization=ilm
            -Dsonar.qualitygate.wait=true
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.sources=.
            -Dsonar.tests=crates,app/src,app/playwright
            -Dsonar.test.inclusions=crates/**/tests/**,app/src/**/*.spec.ts,app/src/**/*.spec.tsx,app/src/**/*.ct.tsx,app/playwright/**
            -Dsonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,reports/**,app/coverage-vitest/**,crates/**/tests/**,app/src/**/*.spec.ts,app/src/**/*.spec.tsx,app/src/**/*.ct.tsx,app/playwright/**
            -Dsonar.coverage.exclusions=app/src/main.tsx,app/*.config.ts,scripts/**,crates/app/src/main.rs,crates/app/build.rs
            -Dsonar.rust.lcov.reportPaths=reports/rust.lcov
            -Dsonar.rust.clippyReport.reportPaths=reports/clippy.json
            -Dsonar.javascript.lcov.reportPaths=reports/ui.lcov
