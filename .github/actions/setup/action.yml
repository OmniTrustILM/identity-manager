name: Setup
description: Install Node.js, the Linux system packages for Tauri, the Rust toolchain from rust-toolchain.toml, cargo tools, app dependencies and the Playwright browsers on Linux

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x
        cache: npm
        cache-dependency-path: app/package-lock.json

    - name: Install Linux system packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb dbus-x11

    - name: Install Rust toolchain
      shell: bash
      # rustup reads rust-toolchain.toml; no version is named here.
      run: rustup toolchain install

    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Install cargo tools
      uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
      with:
        tool: cargo-llvm-cov@0.9.1,cargo-deny@0.20.2

    - name: Install app dependencies
      shell: bash
      working-directory: app
      run: npm ci --ignore-scripts

    - name: Read the Playwright version
      if: runner.os == 'Linux'
      id: playwright
      shell: bash
      working-directory: app
      run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: runner.os == 'Linux'
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install Playwright browsers
      if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: app
      run: ./node_modules/.bin/playwright install --with-deps chromium webkit

    - name: Install Playwright system packages
      if: runner.os == 'Linux' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: app
      run: ./node_modules/.bin/playwright install-deps chromium webkit
